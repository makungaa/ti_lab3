<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Blog – Lab03</title>
    <style>
        body { font-family: Arial; margin: 30px; }
        h2 { margin-top: 40px; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
        th, td { border: 1px solid #ccc; padding: 6px; }
        textarea { width: 100%; height: 60px; }
        button { padding: 4px 8px; margin-top: 5px; }
        .box { border: 1px solid #ccc; padding: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

<h1>Blog (lab3)</h1>

<h2>Dodaj nowy post</h2>
<div class="box">
    <input id="postTitleInput" placeholder="Tytuł posta" style="width:100%;"><br><br>
    <textarea id="postBodyInput" placeholder="Treść posta"></textarea><br>
    <button onclick="addPost()">Dodaj post</button>
</div>


<h2>Posty</h2>
<table id="posts">
    <thead>
    <tr>
        <th>ID</th>
        <th>Tytuł</th>
        <th>Akcja</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<div id="postDetails" class="box" style="display:none;">
    <h3 id="postTitle"></h3>
    <p id="postBody"></p>

    <h4>Komentarze (publiczne)</h4>
    <ul id="comments"></ul>

    <h4>Dodaj komentarz</h4>
    <input id="author" placeholder="Autor"><br><br>
    <textarea id="commentBody" placeholder="Treść komentarza"></textarea><br>
    <button onclick="addComment()">Dodaj komentarz</button>
</div>

<h2>Panel moderatora</h2>
<table id="pending">
    <thead>
    <tr>
        <th>ID</th>
        <th>Post</th>
        <th>Autor</th>
        <th>Treść</th>
        <th>Akcja</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
    let currentPostId = null;

    async function loadPosts() {
        const res = await fetch('/api/posts');
        const posts = await res.json();

        const tbody = document.querySelector('#posts tbody');
        tbody.innerHTML = '';

        posts.forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
      <td>${p.Id}</td>
      <td>${p.Title}</td>
      <td>
        <button onclick="showPost(${p.Id})">Pokaż post i komentarze</button>
      </td>
    `;
            tbody.appendChild(tr);
        });
    }

    async function showPost(id) {
        currentPostId = id;

        const postRes = await fetch('/api/posts/' + id);
        const post = await postRes.json();

        document.getElementById('postTitle').innerText = post.Title;
        document.getElementById('postBody').innerText = post.Body;
        document.getElementById('postDetails').style.display = 'block';

        loadComments();
    }

    async function loadComments() {
        const res = await fetch(`/api/posts/${currentPostId}/comments`);
        const comments = await res.json();

        const ul = document.getElementById('comments');
        ul.innerHTML = '';

        comments.forEach(c => {
            const li = document.createElement('li');
            li.innerText = `${c.Author}: ${c.Body}`;
            ul.appendChild(li);
        });
    }

    async function addComment() {
        const author = document.getElementById('author').value;
        const body = document.getElementById('commentBody').value;

        if (!author || !body) {
            alert('Autor i treść są wymagane');
            return;
        }

        const res = await fetch(`/api/posts/${currentPostId}/comments`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ author, body })
        });

        if (res.ok) {
            alert('Komentarz dodany (oczekuje na moderację)');
            document.getElementById('author').value = '';
            document.getElementById('commentBody').value = '';
            loadPending();
        }
    }

    async function loadPending() {
        const res = await fetch('/api/comments/pending');
        const comments = await res.json();

        const tbody = document.querySelector('#pending tbody');
        tbody.innerHTML = '';

        comments.forEach(c => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
      <td>${c.Id}</td>
      <td>${c.PostId}</td>
      <td>${c.Author}</td>
      <td>${c.Body}</td>
      <td>
        <button onclick="approve(${c.Id})">Zatwierdź</button>
      </td>
    `;
            tbody.appendChild(tr);
        });
    }

    async function approve(id) {
        await fetch(`/api/comments/${id}/approve`, {
            method: 'POST'
        });

        loadPending();
        if (currentPostId) {
            loadComments();
        }
    }

    async function addPost() {
        const title = document.getElementById('postTitleInput').value;
        const body = document.getElementById('postBodyInput').value;

        if (!title || !body) {
            alert('Tytuł i treść są wymagane');
            return;
        }

        const res = await fetch('/api/posts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, body })
        });

        if (res.ok) {
            alert('Post dodany');
            document.getElementById('postTitleInput').value = '';
            document.getElementById('postBodyInput').value = '';
            loadPosts();
        } else {
            const err = await res.json();
            alert(err.error || 'Błąd dodawania posta');
        }
    }

    loadPosts();
    loadPending();
</script>

</body>
</html>
